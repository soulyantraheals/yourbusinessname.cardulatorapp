    <script src="https://cdn.tailwindcss.com/3.4.1" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root { --main-bg: #050505; --key-bg: #1a1a2e; --accent: #00ffff; --angle: 0deg; }
        body { background-color: #000; font-family: 'Rajdhani', sans-serif; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        
        /* Updated: Main Frame RGB Lighting Effect */
        .rgb-frame { padding: 4px; border-radius: 2.6rem; transition: all 0.5s; background: #111; position: relative; }
        .rgb-active { 
            background: linear-gradient(var(--angle), #ff0000, #00ff00, #00ffff, #ff00ff, #ff0000) !important; 
            animation: rotate 4s linear infinite; 
        }
        
        @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
        @keyframes rotate { to { --angle: 360deg; } } 


         /* Fixed Display for Overflow */
        .display { 
            background: #000; 
            height: 110px; 
            border-radius: 1.5rem; 
            margin-bottom: 1.5rem; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            padding: 1.5rem; 
            text-align: right; 
            border: 1px solid #222; 
            overflow: hidden; 
            white-space: nowrap;
        }

        #res { transition: font-size 0.1s ease-in-out; }



        .calculator-body { width: 350px; height: 780px; background: var(--main-bg); border-radius: 2.5rem; padding: 1.5rem; display: flex; flex-direction: column; position: relative; z-index: 10; }
        .display { background: #000; height: 110px; border-radius: 1.5rem; margin-bottom: 1.5rem; display: flex; flex-direction: column; justify-content: center; padding: 1.5rem; text-align: right; border: 1px solid #222; overflow: hidden; }

        .key { background: var(--key-bg); color: var(--accent); font-weight: bold; border-radius: 0.8rem; height: 60px; transition: all 0.1s; cursor: pointer; font-size: 1.2rem; position: relative; border: 2px solid transparent; background-clip: padding-box; }
        
        /* RGB Lighting for Number Buttons */
        .key-rgb::after {
            content: ''; position: absolute; inset: -2px; border-radius: 0.8rem;
            background: linear-gradient(var(--angle), #ff0000, #00ff00, #00ffff, #ff00ff, #ff0000);
            z-index: -1; animation: rotate 4s linear infinite; opacity: 0.5;
        }

        .key:active { transform: translateY(3px); filter: brightness(1.5); box-shadow: 0 0 15px var(--accent); }
        .history-key { font-size: 0.7rem !important; line-height: 1; color: #4ade80; }

        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; animation: marquee 12s linear infinite; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal.active { display: flex; }
        .contact-btn { background: linear-gradient(90deg, #e11d48, #9f1239); color: white; font-weight: bold; border-radius: 0.8rem; padding: 12px; font-size: 0.8rem; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; text-decoration: none; }
        
        #getapp-dropdown { display: none; }
        #getapp-dropdown.open { display: block; }
    </style>
</head>

<body> 
    <div id="mainFrame" class="rgb-frame rgb-active">

            <div class="mb-4">

                <div class="flex gap-2">
                    <button onclick="toggleModal('themeModal')" class="flex-1 bg-gray-900 text-[9px] py-2 rounded-lg border border-gray-700 font-bold uppercase">⚙️ Settings</button>
                    <button onclick="toggleModal('contactModal')" class="flex-1 bg-red-950 text-[9px] py-2 rounded-lg border border-red-600 font-bold uppercase">📞 Contact</button>
                </div>
            </div>

            <div class="display">
                <div id="res" class="text-cyan-400 text-3xl font-bold font-['Orbitron']">0</div>
            </div>

            <div class="grid grid-cols-4 gap-2 mb-2" id="key-grid"></div>

            <a id="whatsappOfferLink" href="https://wa.me/917029194911" target="_blank" class="block">
                <div class="mt-2 overflow-hidden bg-black/40 rounded-xl border border-gray-800 p-2 relative cursor-pointer active:scale-95 transition-transform">
                    <div class="relative h-[120px] flex items-center justify-center overflow-hidden">
                        <img id="sliderImage" src="icons/range_of_cars.png" class="w-full h-auto max-h-[100px] object-contain transition-all duration-500 transform">
                    </div>
                    <div class="mt-2 bg-red-950/30 border-t border-red-900/50 py-1.5 overflow-hidden flex items-center">
                        <div id="offerText" class="whitespace-nowrap animate-marquee text-[10px] font-bold text-red-400 tracking-widest uppercase">
                            🚀 LOADING LATEST OFFERS...
                        </div>
                    </div>
                </div>
            </a>

            <div class="relative w-full mt-4 px-2">
                <button id="getapp-btn" onclick="toggleGetApp()" class="w-full bg-gradient-to-r from-gray-800 to-gray-900 border border-gray-700 text-white py-3 rounded-xl font-bold uppercase tracking-widest text-[10px] flex items-center justify-center gap-2 transition-all">
                    📥 GET THE APP
                    <svg id="getapp-chevron" class="w-3 h-3 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                
                <div id="getapp-dropdown" class="absolute bottom-full left-2 right-2 mb-1 bg-[#0f0f1a] border border-gray-700 rounded-xl overflow-hidden shadow-2xl z-[100]">
                    <a href="https://play.google.com/store/apps/details?id=com.scrollzea.cardulator" class="flex items-center justify-between p-3 hover:bg-green-900/20 border-b border-gray-800 transition-colors">
                        <span class="text-xs font-bold text-green-400">🤖 ANDROID APK</span>
                        <span class="text-[8px] bg-green-900/50 px-2 py-0.5 rounded text-green-300">DOWNLOAD</span>
                    </a>
                    
                    <button onclick="presentInstallPrompt()" class="w-full flex items-center justify-between p-3 hover:bg-yellow-900/20 border-b border-gray-800 transition-colors text-left">
                        <span class="text-xs font-bold text-yellow-400">🍎 APPLE iOS</span>
                        <span class="text-[8px] bg-yellow-900/50 px-2 py-0.5 rounded text-yellow-300 text-center">COMING SOON</span>
                    </button>


                    <button onclick="presentInstallPrompt()" class="w-full flex items-center justify-between p-3 hover:bg-yellow-900/20 border-b border-gray-800 transition-colors text-left">
                        <span class="text-xs font-bold text-yellow-400">🌐 INSTALL PWA APP</span>
                        <span class="text-[8px] bg-yellow-900/50 px-2 py-0.5 rounded text-yellow-300 text-center">COMING SOON</span>
                    </button>

                    <button onclick="presentInstallPrompt()" class="w-full flex items-center justify-between p-3 hover:bg-yellow-900/20 border-b border-gray-800 transition-colors text-left">
                        <span class="text-xs font-bold text-yellow-400">🌐 LEARN MORE </span>
                        <span class="text-[8px] bg-yellow-900/50 px-2 py-0.5 rounded text-yellow-300 text-center">COMING SOON</span>
                    </button>
                </div>
            </div>

            </div>
        </div>
    </div>

    <div id="themeModal" class="modal">
        <div class="bg-[#0f0f1a] border-2 border-cyan-900 rounded-[2rem] p-8 w-80 text-center">
            <h2 class="text-xl font-bold text-cyan-400 mb-6 font-['Orbitron']">SYSTEM CFG</h2>
            <div class="space-y-4 text-left">
                <button id="rgbToggle" onclick="toggleRGB()" class="w-full bg-green-900/30 text-green-400 p-2 rounded border border-green-700 text-xs font-bold uppercase">RGB FRAME: ON</button>
                <select id="themeSelect" onchange="applyChanges()" class="w-full bg-black border border-gray-700 p-2 rounded text-xs text-white">
                    <option value="black">Mechanical Black</option>

                </select>
                <select id="soundSelect" onchange="saveSettings()" class="w-full bg-black border border-gray-700 p-2 rounded text-xs text-white">
                    <option value="blue">Blue Switch (Clicky)</option>
                    <option value="brown">Brown Switch (Tactile)</option>
                    <option value="red">Red Switch (Linear)</option>
                    <option value="retro">Retro Typewriter</option>
                </select>
            </div>
            <button onclick="closeActiveModal()" class="w-full bg-cyan-600 text-white font-bold py-3 rounded-xl mt-6">SAVE & CLOSE</button>
        </div>
    </div>


    <div id="contactModal" class="modal">
        <div class="bg-[#0f0f1a] border-2 border-red-600 rounded-[2rem] p-8 w-80 text-center">
            <h2 class="text-lg font-bold text-red-500 mb-4 font-['Orbitron']">CONTACT BUSINESS</h2>
            <div class="space-y-2 mb-4">
                <a href="tel:1234567899" class="contact-btn">🚗 BOOK PRODUCT</a>
                <a href="tel:1234567899" class="contact-btn">🔑 BOOK TEST DRIVE</a>
                <a href="tel:1234567899" class="contact-btn !bg-indigo-800">🛠️ SERVICE BOOKING</a>
                <a href="https://wa.me/917029194911" class="contact-btn !bg-green-600">💬 WHATSAPP US</a>
            </div>
            <div class="flex justify-center gap-4 mt-4 border-t border-gray-800 pt-4">
                <a href="https://www.facebook.com/scrollzea" target="_blank" class="social-link"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" class="w-5 h-5 invert"></a>
                <a href="https://www.instagram.com/scrollzea" target="_blank" class="social-link"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" class="w-5 h-5 invert"></a>
                <a href="https://scrollzea.vercel.app/" target="_blank" class="social-link"><img src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png" class="w-5 h-5 invert"></a>
            </div>
            <button onclick="closeActiveModal()" class="mt-4 text-gray-500 text-[10px] uppercase">Close</button>
        </div>
    </div>


    <script>
        let expr = "";
        let audioCtx = null;
        let getAppOpen = false;
        const MAX_CHARS = 12;
        const keys = ['C', '÷', '×', '⌫', '7', '8', '9', '-', '4', '5', '6', '+', '1', '2', '3', '=', '0', '.', 'LOG'];

        function renderKeys() {
            const grid = document.getElementById('key-grid');
            grid.innerHTML = "";
            keys.forEach(k => {
                const isNumber = !isNaN(k) || k === '.';
                const btn = document.createElement('button');
                btn.className = `key ${k === '0' ? 'col-span-2' : ''} ${k === 'LOG' ? 'history-key' : ''} ${isNumber ? 'key-rgb' : ''}`;
                btn.innerText = k === 'LOG' ? 'LOG\nHISTORY' : k;
                btn.onclick = () => triggerAction(k);
                grid.appendChild(btn);
            });
        }

        window.addEventListener('popstate', () => {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
            document.getElementById('getapp-dropdown').classList.remove('open');
            document.getElementById('getapp-chevron').classList.remove('rotate-180');
            getAppOpen = false;
        });

        function toggleModal(id) {
            document.getElementById(id).classList.add('active');
            history.pushState({ panel: id }, '');
        }

        function closeActiveModal() { history.back(); }

        function toggleGetApp() {
            getAppOpen = !getAppOpen;
            const drop = document.getElementById('getapp-dropdown');
            const chev = document.getElementById('getapp-chevron');
            if (getAppOpen) {
                drop.classList.add('open');
                chev.classList.add('rotate-180');
                history.pushState({ panel: 'getapp' }, '');
            } else {
                history.back();
            }
        }

        function triggerAction(k) {
            playSound();
            const resDisplay = document.getElementById('res');
            
            if (k === 'LOG') {
                const historyList = JSON.parse(localStorage.getItem('calc_history_list') || "[]");
                alert(historyList.length === 0 ? "No history." : historyList.join('\n'));
                return;
            }

            if (k === 'C') {
                expr = "";
            } else if (k === '⌫') {
                expr = expr.slice(0, -1);
            } else if (k === '=') {
                try {
                    let result = eval(expr.replace(/×/g, '*').replace(/÷/g, '/'));
                    let resultStr = result.toString();
                    
                    // Handle very long decimals or big numbers
                    if (resultStr.length > MAX_CHARS) {
                        resultStr = result.toPrecision(8).toString();
                    }
                    
                    let hist = JSON.parse(localStorage.getItem('calc_history_list') || "[]");
                    hist.unshift(`${expr} = ${resultStr}`);
                    localStorage.setItem('calc_history_list', JSON.stringify(hist.slice(0, 10)));
                    expr = resultStr;
                } catch { expr = "Error"; }
            } else {
                if (expr === "Error") expr = "";
                // DIGIT LIMIT CHECK
                if (expr.length < MAX_CHARS) {
                    expr += k;
                }
            }

            resDisplay.innerText = expr || "0";

            // DYNAMIC FONT SCALING
            if (expr.length > 9) {
                resDisplay.style.fontSize = "1.5rem";
            } else if (expr.length > 7) {
                resDisplay.style.fontSize = "2rem";
            } else {
                resDisplay.style.fontSize = "1.875rem"; // Tailwind's 3xl
            }
        }



        function playSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const type = document.getElementById('soundSelect').value;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = (type === 'blue') ? 'square' : (type === 'brown') ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function toggleRGB() { 
    const frame = document.getElementById('mainFrame');
    // Corrected ID to match your HTML (rgbToggle instead of rgbToggleBtn)
    const btn = document.getElementById('rgbToggle'); 
    
    const isActive = frame.classList.toggle('rgb-active');
    
    // Update the button text based on the active state
    if (isActive) {
        btn.innerText = "RGB FRAME: ON";
        btn.classList.replace('bg-red-900/30', 'bg-green-900/30'); // Visual feedback
        btn.classList.replace('text-red-400', 'text-green-400');
    } else {
        btn.innerText = "RGB FRAME: OFF";
        btn.classList.replace('bg-green-900/30', 'bg-red-900/30'); // Red when OFF
        btn.classList.replace('text-green-400', 'text-red-400');
    }
}

        function applyChanges() {
            const theme = document.getElementById('themeSelect').value;
            const themes = {
                black: { main: '#050505', key: '#1a1a2e', acc: '#00ffff' },
                indigo: { main: '#0a0a20', key: '#312e81', acc: '#818cf8' },
                white: { main: '#f3f4f6', key: '#ffffff', acc: '#111827' },
                pink: { main: '#2d0a1a', key: '#4d1635', acc: '#ff007f' }
            };
            const s = themes[theme];
            document.documentElement.style.setProperty('--main-bg', s.main);
            document.documentElement.style.setProperty('--key-bg', s.key);
            document.documentElement.style.setProperty('--accent', s.acc);
        }

    

        window.onload = () => { renderKeys(); setInterval(() => {
            currentIndex = (currentIndex + 1) % carImages.length;
            document.getElementById('sliderImage').src = carImages[currentIndex].src;
            document.getElementById('offerText').innerText = carImages[currentIndex].offer + " — CLICK —";
        }, 4000); };

    </script>


</body>
</html>
